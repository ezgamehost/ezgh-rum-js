name: Release

# On a v* tag (cut after `bun scripts/version.ts X.Y.Z` is committed on main): check, pack, and
# publish the six @ezghcloud packages to npm, then a GitHub release carrying the script tag's SRI
# hash. Re-running skips versions already on npm. Publishing uses npm trusted publishing (GitHub
# Actions OIDC): no npm token exists, and npm attaches provenance itself. First-time owner setup,
# once per package name before its first release: `scripts/npm-trust.sh <package names>`, which
# trusts this file by name, so keep it called release.yml.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm supports trusted publishing (11.5.1 or later)
        run: |
          v=$(npm --version)
          printf '11.5.1\n%s\n' "$v" | sort -V -C || { echo "::error::npm $v is older than 11.5.1"; exit 1; }
          echo "npm $v"
      - run: bun install --frozen-lockfile
      - name: the tag matches every package version
        run: |
          v="${GITHUB_REF_NAME#v}"
          for p in packages/*/package.json; do
            [ "$(node -p "require('./$p').version")" = "$v" ] || { echo "::error::$p isn't $v"; exit 1; }
          done
      - run: bun run check
      - run: bun scripts/pack.ts
      - name: publish (dependencies first)
        run: |
          for p in rum rum-build rum-react rum-vue rum-angular rum-nextjs; do
            name=$(node -p "require('./packages/$p/package.json').name")
            v=$(node -p "require('./packages/$p/package.json').version")
            if npm view "$name@$v" version >/dev/null 2>&1; then echo "$name@$v is already published"; continue; fi
            npm publish ".packs/$(echo "$name" | sed 's|@||;s|/|-|')-$v.tgz" --access public
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file .packs/release-notes.md
