name: CI

# check: lint, typecheck, unit tests, build, bundle budgets and pack. browsers: the Playwright suite
# against the fixture app and the fake intake in Chromium, Firefox and WebKit. tunnel-go: the Go
# tunnel handler's test. Linux runners only.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check

  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Until the Playwright suite lands (plan 25 J7) there's nothing to run.
      - id: suite
        run: if [ -f playwright.config.ts ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.suite.outputs.present == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - if: steps.suite.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: steps.suite.outputs.present == 'true'
        run: bun install --frozen-lockfile
      - if: steps.suite.outputs.present == 'true'
        run: bun run build
      - if: steps.suite.outputs.present == 'true'
        run: bunx playwright install --with-deps chromium firefox webkit
      - if: steps.suite.outputs.present == 'true'
        run: bun run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  tunnel-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: examples/tunnel/go/go.mod
      - run: cd examples/tunnel/go && test -z "$(gofmt -l .)" && go vet ./... && go test -race ./...
